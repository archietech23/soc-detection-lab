<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 8; ry: 8; }
      .attacker { fill: #fef2f2; stroke: #b91c1c; }
      .sensor { fill: #eff6ff; stroke: #1d4ed8; }
      .siem { fill: #ecfdf5; stroke: #047857; }
      .git { fill: #faf5ff; stroke: #7e22ce; }
      .label { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .sub { font-size: 12px; fill: #475569; }
      .flow { font-size: 11px; fill: #334155; font-style: italic; }
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .arrow { stroke: #334155; stroke-width: 1.5; fill: none; }
      .arrow-git { stroke: #7e22ce; stroke-width: 1.5; fill: none; stroke-dasharray: 5,4; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" class="title">SOC Detection Lab — Data Flow</text>

  <!-- Attacker -->
  <rect x="40" y="80" width="200" height="110" class="box attacker"/>
  <text x="140" y="110" text-anchor="middle" class="label">Compromised Host</text>
  <text x="140" y="130" text-anchor="middle" class="sub">Member Server</text>
  <text x="140" y="148" text-anchor="middle" class="sub">10.10.15.6</text>
  <text x="140" y="170" text-anchor="middle" class="sub">Atomic Red Team</text>

  <!-- DC -->
  <rect x="340" y="80" width="200" height="110" class="box sensor"/>
  <text x="440" y="110" text-anchor="middle" class="label">Domain Controller</text>
  <text x="440" y="130" text-anchor="middle" class="sub">PDC001 / ARCHIETECH.LOCAL</text>
  <text x="440" y="152" text-anchor="middle" class="sub">Security + Sysmon logs</text>
  <text x="440" y="170" text-anchor="middle" class="sub">Splunk UF → 9997/tcp</text>

  <!-- Splunk -->
  <rect x="640" y="80" width="220" height="110" class="box siem"/>
  <text x="750" y="110" text-anchor="middle" class="label">Splunk Enterprise</text>
  <text x="750" y="130" text-anchor="middle" class="sub">Linux indexer + search head</text>
  <text x="750" y="152" text-anchor="middle" class="sub">indexes: wineventlog, sysmon</text>
  <text x="750" y="170" text-anchor="middle" class="sub">scheduled detections run here</text>

  <!-- Arrows top row -->
  <path d="M 240 135 L 335 135" class="arrow" marker-end="url(#arrow)"/>
  <text x="287" y="125" text-anchor="middle" class="flow">attacks</text>
  <text x="287" y="152" text-anchor="middle" class="flow">4769, 4625</text>

  <path d="M 540 135 L 635 135" class="arrow" marker-end="url(#arrow)"/>
  <text x="587" y="125" text-anchor="middle" class="flow">forwarded</text>
  <text x="587" y="152" text-anchor="middle" class="flow">events</text>

  <!-- Git / DaC layer -->
  <rect x="140" y="290" width="620" height="150" class="box git"/>
  <text x="450" y="320" text-anchor="middle" class="label">Detection-as-Code Pipeline</text>
  <text x="450" y="342" text-anchor="middle" class="sub">github.com/archietech23/soc-detection-lab</text>

  <rect x="170" y="360" width="170" height="60" fill="#ffffff" stroke="#7e22ce" stroke-width="1" rx="6"/>
  <text x="255" y="382" text-anchor="middle" class="sub" font-weight="600">Laptop</text>
  <text x="255" y="402" text-anchor="middle" class="sub">edit → commit → push</text>

  <rect x="365" y="360" width="170" height="60" fill="#ffffff" stroke="#7e22ce" stroke-width="1" rx="6"/>
  <text x="450" y="382" text-anchor="middle" class="sub" font-weight="600">GitHub</text>
  <text x="450" y="402" text-anchor="middle" class="sub">source of truth + CI lint</text>

  <rect x="560" y="360" width="170" height="60" fill="#ffffff" stroke="#7e22ce" stroke-width="1" rx="6"/>
  <text x="645" y="382" text-anchor="middle" class="sub" font-weight="600">Splunk host</text>
  <text x="645" y="402" text-anchor="middle" class="sub">git pull → make deploy</text>

  <path d="M 340 390 L 360 390" class="arrow-git" marker-end="url(#arrow)"/>
  <path d="M 535 390 L 555 390" class="arrow-git" marker-end="url(#arrow)"/>

  <!-- Arrow from Splunk down to DaC -->
  <path d="M 750 190 C 750 240, 645 240, 645 355" class="arrow-git" marker-end="url(#arrow)"/>
  <text x="795" y="235" class="flow" fill="#7e22ce">detections</text>
  <text x="795" y="250" class="flow" fill="#7e22ce">deployed here</text>

  <!-- Legend -->
  <rect x="40" y="470" width="14" height="14" class="box attacker"/>
  <text x="62" y="482" class="sub">Attacker plane</text>
  <rect x="180" y="470" width="14" height="14" class="box sensor"/>
  <text x="202" y="482" class="sub">Sensor</text>
  <rect x="290" y="470" width="14" height="14" class="box siem"/>
  <text x="312" y="482" class="sub">SIEM</text>
  <rect x="400" y="470" width="14" height="14" class="box git"/>
  <text x="422" y="482" class="sub">Detection-as-Code layer (this repo)</text>
</svg>
