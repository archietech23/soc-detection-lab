# -----------------------------------------------------------------------------
# T1558.003 — Kerberoasting: RC4 Service Ticket Requested
# Card: detections/kerberoasting.md
# -----------------------------------------------------------------------------
[Kerberoasting - RC4 Service Ticket Requested]
description = Detects RC4-encrypted (0x17) Kerberos service ticket requests to user SPNs on a DC, indicative of Kerberoasting (T1558.003). See detections/kerberoasting.md.
search = index=wineventlog EventCode=4769 Ticket_Encryption_Type=0x17 NOT Service_Name="*$" NOT Service_Name="krbtgt" | eval src_ip=replace(Client_Address,"^::ffff:","") | stats count as rc4_requests min(_time) as firstTime max(_time) as lastTime values(Service_Name) as targeted_spns dc(Service_Name) as distinct_spns by Account_Name, src_ip, host | convert ctime(firstTime) ctime(lastTime) | sort - rc4_requests
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
is_scheduled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
alert.suppress = 0
actions =

# -----------------------------------------------------------------------------
# T1110.003 — Password Spray: Single Source, Many Accounts
# Card: detections/password-spray.md
# -----------------------------------------------------------------------------
[Password Spray - Single Source Many Accounts]
description = Detects one source failing authentication (4625) across many distinct accounts in a short window, indicative of password spraying (T1110.003). See detections/password-spray.md.
search = index=wineventlog EventCode=4625 | eval src_ip=replace(Source_Network_Address,"^::ffff:","") | bin _time span=5m | stats dc(Account_Name) as distinct_accounts count as failed_attempts values(Account_Name) as targeted_accounts values(Sub_Status) as failure_codes by _time, src_ip, host | where distinct_accounts >= 5 | sort - distinct_accounts
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
is_scheduled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.track = 1
alert.suppress = 0
actions =
